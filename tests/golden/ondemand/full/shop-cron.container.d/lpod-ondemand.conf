# Written by "lpod shop ondemand enable". See "On-demand" in lpod's docs/commands.md.
[Unit]
Requires=shop-db.service
After=shop-db.service

[Container]
Environment="APP_COMMAND=php artisan schedule:run --pct=50%%"
Environment="NOTE=say \"hi\" \\o/"

[Service]
Type=oneshot
Restart=no
ExecStartPre=-/bin/sh -c 'trigger=$$(systemctl --user show -P LastTriggerUSec --timestamp=unix "$$1"); trigger=$${trigger#@}; case "$$trigger" in ""|*[!0-9]*) exit 0;; esac; [ $$((trigger %% 60)) -ge 30 ] || exit 0; wait=$$(( (trigger / 60 + 1) * 60 - $$(date +%%s) )); [ "$$wait" -le 0 ] || exec sleep "$$wait"' sh shop-cron.timer
TimeoutStartSec=300
